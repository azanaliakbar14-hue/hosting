<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hype Tiers - Rankings</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <span class="logo-icon">&#9889;</span>
                <span class="logo-text">HYPE<span class="accent">TIERS</span></span>
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="ranking.html" class="active">Rankings</a></li>
            </ul>
            <div class="nav-auth" id="navAuth">
                <a href="signin.html" class="btn btn-outline">Sign In</a>
                <a href="signup.html" class="btn btn-primary">Sign Up</a>
            </div>
            <div class="nav-user" id="navUser" style="display:none;">
                <span class="user-greeting">Welcome, <span id="userName"></span></span>
                <button class="btn btn-outline" id="logoutBtn">Logout</button>
            </div>
            <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">
                <span></span><span></span><span></span>
            </button>
        </div>
    </nav>

    <!-- Ranking Header -->
    <section class="ranking-hero">
        <div class="container">
            <h1 class="page-title">Leader<span class="accent">board</span></h1>
            <p class="page-subtitle">Select a gamemode to view the rankings</p>
        </div>
    </section>

    <!-- Gamemode Filter -->
    <section class="ranking-filters">
        <div class="container">
            <div class="filter-tabs">
                <button class="filter-tab active" data-mode="all">
                    <span class="filter-icon">&#11088;</span>
                    All
                </button>
                <button class="filter-tab" data-mode="roleplay">
                    <span class="filter-icon">
                        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" width="20" height="20">
                            <circle cx="32" cy="20" r="10" stroke="currentColor" stroke-width="3"/>
                            <path d="M12 52c0-11 9-20 20-20s20 9 20 20" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
                            <path d="M32 36v8M28 40h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                    </span>
                    Roleplay
                </button>
                <button class="filter-tab" data-mode="racing">
                    <span class="filter-icon">
                        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" width="20" height="20">
                            <rect x="10" y="28" width="44" height="16" rx="4" stroke="currentColor" stroke-width="3"/>
                            <circle cx="20" cy="48" r="5" stroke="currentColor" stroke-width="3"/>
                            <circle cx="44" cy="48" r="5" stroke="currentColor" stroke-width="3"/>
                            <path d="M18 28l4-12h20l4 12" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                            <line x1="30" y1="16" x2="30" y2="28" stroke="currentColor" stroke-width="2"/>
                        </svg>
                    </span>
                    Racing
                </button>
                <button class="filter-tab" data-mode="drift">
                    <span class="filter-icon">
                        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" width="20" height="20">
                            <path d="M12 44c8-16 16-8 24-24s16-8 16 4" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
                            <path d="M16 52c6-12 12-6 18-18s12-6 12 3" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
                            <circle cx="46" cy="24" r="4" stroke="currentColor" stroke-width="3"/>
                            <path d="M8 48l6-4 6 4 6-4 6 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
                        </svg>
                    </span>
                    Drift
                </button>
                <button class="filter-tab" data-mode="deathmatch">
                    <span class="filter-icon">
                        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" width="20" height="20">
                            <path d="M32 8v48M8 32h48" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
                            <circle cx="32" cy="32" r="8" stroke="currentColor" stroke-width="3"/>
                            <circle cx="32" cy="32" r="16" stroke="currentColor" stroke-width="2" opacity="0.5"/>
                        </svg>
                    </span>
                    Deathmatch
                </button>
                <button class="filter-tab" data-mode="survival">
                    <span class="filter-icon">
                        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" width="20" height="20">
                            <path d="M32 10l4 12h12l-10 7 4 12-10-7-10 7 4-12-10-7h12z" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
                            <path d="M20 50h24M24 54h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                    </span>
                    Survival
                </button>
                <button class="filter-tab" data-mode="heist">
                    <span class="filter-icon">
                        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" width="20" height="20">
                            <rect x="14" y="24" width="36" height="28" rx="3" stroke="currentColor" stroke-width="3"/>
                            <path d="M24 24V18a8 8 0 1116 0v6" stroke="currentColor" stroke-width="3"/>
                            <circle cx="32" cy="38" r="5" stroke="currentColor" stroke-width="3"/>
                            <line x1="32" y1="43" x2="32" y2="47" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
                        </svg>
                    </span>
                    Heist
                </button>
            </div>
        </div>
    </section>

    <!-- Ranking Table -->
    <section class="ranking-table-section">
        <div class="container">
            <div class="ranking-table-wrapper">
                <table class="ranking-table">
                    <thead>
                        <tr>
                            <th>Rank</th>
                            <th>Player</th>
                            <th>Gamemode</th>
                            <th>Tier</th>
                            <th>Score</th>
                            <th>Wins</th>
                            <th>Matches</th>
                        </tr>
                    </thead>
                    <tbody id="rankingBody">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
                <div class="empty-state" id="emptyState">
                    <div class="empty-icon">&#128203;</div>
                    <h3>No Players Yet</h3>
                    <p>Be the first to join and climb the leaderboard!</p>
                    <a href="signup.html" class="btn btn-primary">Sign Up Now</a>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-brand">
                    <span class="logo-icon">&#9889;</span>
                    <span class="logo-text">HYPE<span class="accent">TIERS</span></span>
                </div>
                <p class="footer-copy">&copy; 2025 Hype Tiers. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/ranking.js"></script>
</body>
</html>
